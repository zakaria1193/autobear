[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocompdb"
version = "0.1.0"
description = "Capture compilation databases for GNU configure and make builds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
autocompdb = "autocompdb.cli:main"

[tool.setuptools.packages.find]
include = ["autocompdb*"]

[tool.setuptools.package-data]
autocompdb = ["prompts/*.txt"]
