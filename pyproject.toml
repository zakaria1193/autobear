[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autobear"
version = "0.1.0"
description = "Capture compilation databases for GNU configure and make builds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
autobear = "autobear.cli:main"

[tool.setuptools.packages.find]
include = ["autobear*"]

[tool.setuptools.package-data]
autobear = ["prompts/*.txt"]
